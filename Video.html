<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!-- 設定網頁編碼，讓中文能正常顯示 -->
  <meta charset="UTF-8">
  <!-- 讓網頁在手機上也能完美排版 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的教學影片</title>
  <!-- 簡單的排版美化 -->
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f9f9f9; padding: 20px; }
    .video-container { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>歡迎來到教學專區</h1>
  <p>請觀看下方的教學影片</p>
  
  <div class="video-container">
    <!-- 請把下面這行 iframe 換成你剛剛在 YouTube 複製的嵌入碼 -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/你的影片ID" frameborder="0" allowfullscreen></iframe>
  </div>
</body>
</html>
