<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>限時教學內容</title>
  <style>
    /* 基本頁面樣式 */
    body { font-family: sans-serif; text-align: center; margin-top: 25vh; background-color: #f4f4f4; padding: 20px; }
    
    /* 警示彈窗遮罩：設定為全螢幕，放在最上層 */
    #warning-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.95); /* 深黑色背景 */
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999; /* 確保在所有東西上面 */
      padding: 20px;
      box-sizing: border-box;
    }

    .warning-box {
      max-width: 500px;
      border: 2px solid #ff4d4d;
      padding: 30px;
      border-radius: 15px;
    }

    h1 { color: #ff4d4d; font-size: 28px; }
    .warning-text { font-size: 18px; margin-bottom: 30px; line-height: 1.6; }

    /* 按鈕樣式 */
    .btn-enter { 
      padding: 15px 40px; 
      font-size: 18px; 
      background-color: #EE4D2D; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
      margin: 10px;
    }
    .btn-leave {
      padding: 10px 20px;
      background-color: transparent;
      color: #ccc;
      border: 1px solid #ccc;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 警示標語遮罩區塊 -->
  <div id="warning-overlay">
    <div class="warning-box">
      <h1>⚠️ 內容分級警示</h1>
      <p class="warning-text">
        本網站包含特定主題之教學內容（如：NSFW/成人內容），<br>
        未滿 18 歲之未成年人禁止進入。<br>
        <br>
        點擊「同意並進入」即表示您已滿 18 歲，<br>
        並願意同步開啟贊助商頁面以支持本站。
      </p>
      
      <!-- 同意進入的按鈕 -->
      <button class="btn-enter" onclick="agreeAndEnter()">同意並進入</button>
      
      <br>
      <!-- 不同意的離開連結 -->
      <a href="https://www.google.com" class="btn-leave">我未滿 18 歲，離開</a>
    </div>
  </div>

  <!-- 原本的頁面背景內容（使用者同意前看不到） -->
  <div id="main-content">
    <h2>正在為您載入教學影片...</h2>
    <p>如果網頁沒有自動跳轉，請重新整理頁面。</p>
  </div>

  <script>
    function agreeAndEnter() {
      // 1. 執行原本的蝦皮跳轉邏輯
      // 這裡換成你的蝦皮分潤連結
      window.open('https://你的蝦皮分潤連結.com', '_blank');
      
      // 2. 將當前頁面轉到影片頁
      window.location.href = 'video.html';
      
      // 3. 隱藏遮罩（雖然已經跳轉了，但為了保險起見加上這行）
      document.getElementById('warning-overlay').style.display = 'none';
    }
  </script>

</body>
</html>
