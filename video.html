<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>限時教學影片</title>
<style>
body { font-family: sans-serif; text-align: center; background-color: #f9f9f9; padding: 20px; }
.video-container { margin-top: 30px; }

#countdown { color: #d93025; font-weight: bold; font-size: 18px; margin-top: 10px; }
#expired-message { display: none; color: #555; margin-top: 50px; font-size: 24px; font-weight: bold; }

/* 讓影片在手機上也能自動適應螢幕大小 */
iframe { max-width: 100%; border: none; }
</style>
</head>
<body>

<div id="content-area">
    <h1>限時教學專區</h1>
    <p id="countdown">計算中...</p>

    <div class="video-container">
        <iframe src="https://drive.google.com/file/d/1Z-53oRw5Ug2rp7qHFkCljg0j437tC5KT/preview" width="640" height="480" allow="autoplay"></iframe>
    </div>
</div>

<div id="expired-message">
    <p>⏳ 抱歉，這部影片的 24 小時限定觀看時間已結束！</p>
    <p style="font-size: 16px; font-weight: normal;">請期待下一次的教學釋出。</p>
</div>

<script>
// 修正後的日期格式，移除雜質符號並確保格式正確 (YYYY-MM-DDTHH:mm:ss)
const expireDate = new Date("2026-05-10T00:00:00").getTime();

const timer = setInterval(function() {
    const now = new Date().getTime();
    const distance = expireDate - now;

    if (distance > 0) {
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerHTML = "距離影片下架剩餘：" + hours + "小時 " + minutes + "分 " + seconds + "秒";
    }
    else {
        clearInterval(timer);
        document.getElementById("content-area").style.display = "none";
        document.getElementById("expired-message").style.display = "block";
    }
}, 1000);
</script>
</body>
</html>
